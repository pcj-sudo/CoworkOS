name: Redirect to CoWorkOS official website
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Generate migration redirects
        run: |
          mkdir _site
          python3 - <<'PYTHON'
          from pathlib import Path
          html = """<!doctype html><html lang="en"><meta charset="utf-8"><title>CoWorkOS — moved</title><script>location.replace('https://coworkos-ai.github.io/'+location.pathname.replace(/^\/CoworkOS\/?/,'')+location.search+location.hash)</script><a href="https://coworkos-ai.github.io/">Continue to CoWorkOS</a></html>"""
          for name in ['index.html', 'showcase.html', '404.html']:
              Path('_site',name).write_text(html)
          Path('_site/.nojekyll').touch()
          PYTHON
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
